name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/bff/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare Secret
        id: check-secret
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "Cloudflare API token not configured. Skipping deploy."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.check-secret.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.check-secret.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/bff/package-lock.json

      - name: Install deps
        if: steps.check-secret.outputs.skip != 'true'
        run: npm ci
        working-directory: apps/bff

      - name: Typecheck
        if: steps.check-secret.outputs.skip != 'true'
        run: npm run typecheck
        working-directory: apps/bff

      - name: Deploy to Cloudflare Workers
        if: steps.check-secret.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/bff'
        env:
          PLATFORM_GEMINI_KEY: ${{ secrets.PLATFORM_GEMINI_KEY }}
          PLATFORM_ENABLED: ${{ secrets.PLATFORM_ENABLED }}
          PLATFORM_DAILY_LIMIT: ${{ secrets.PLATFORM_DAILY_LIMIT }}
          PLATFORM_PER_USER_DAILY: ${{ secrets.PLATFORM_PER_USER_DAILY }}
