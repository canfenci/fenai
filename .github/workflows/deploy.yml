name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'apps/bff/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

